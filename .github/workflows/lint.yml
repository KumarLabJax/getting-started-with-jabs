name: Lint

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff==0.16.9
      - name: Run ruff on student_scripts/
        run: ruff check student_scripts/
      - name: Check docstrings (Google style) in all Python files
        # pydocstyle rules via ruff: every module, class and function needs a docstring,
        # and Args/Returns sections must be complete. Notebooks are excluded.
        run: |
          ruff check --select D --config "lint.pydocstyle.convention = 'google'" \
            --extend-exclude "*.ipynb" student_scripts developer references
