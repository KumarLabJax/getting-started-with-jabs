name: Test Start Scripts

# Runs the one-click launchers (student_scripts/start_jabs.sh and the macOS
# .command wrapper) on Linux and macOS, so a broken install or practice-set
# build is caught before students hit it. Windows (start_jabs.ps1/.bat) is
# tested by hand.
on:
  push:
    branches: [dev, main, v3]
    paths:
      - "student_scripts/**"
      - "requirements.txt"
      - "student_notebooks/live_demo/**"
      - "data/dense_gt_a1/**"
      - "data/dense_gt_a2/**"
      - ".github/workflows/test_start_scripts.yml"
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
  schedule:
    # Weekly: catches upstream package changes (JABS, numpy, ...).
    - cron: "41 3 * * 1"

jobs:
  offline-start:
    name: ${{ matrix.os }} / ${{ matrix.launcher }} (toy data)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            launcher: start_jabs.sh
          - os: macos-latest
            launcher: start_jabs.sh
          - os: macos-latest
            launcher: start_jabs.command
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Run the launcher without GUI, notebook or data download
        run: |
          chmod +x student_scripts/${{ matrix.launcher }}
          ./student_scripts/${{ matrix.launcher }} --no-gui --no-notebook --skip-data

      - name: Install the Qt system libraries the JABS GUI needs (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1

      - name: Check the environment the launcher built
        run: |
          source .venv/bin/activate
          python student_scripts/verify_environment.py
          jabs-cli --help > /dev/null
          jabs-classify --help > /dev/null
          python -m jupyterlab --version
          # The GUI needs a display; importing it headlessly proves the Qt install works.
          QT_QPA_PLATFORM=offscreen python -c "import jabs.ui.main_window.main_window"

      - name: Rerun is a no-op (launcher must be idempotent)
        run: ./student_scripts/${{ matrix.launcher }} --no-gui --no-notebook --skip-data

  full-start:
    name: ${{ matrix.os }} / full data + live demo
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Run the launcher with the Zenodo download (no GUI, no notebook)
        run: ./student_scripts/start_jabs.sh --no-gui --no-notebook

      - name: Check the practice set
        run: |
          source .venv/bin/activate
          python - <<'EOF'
          import json
          from pathlib import Path

          d = Path("data/zenodo_scrubbed/jabs_grooming")
          poses = sorted(d.glob("*_pose_est_v6.h5"))
          anns = sorted((d / "jabs" / "annotations").glob("*.json"))
          assert len(poses) == 10, f"expected 10 practice sessions, found {len(poses)}"
          assert not (d / "2010_pose_est_v6.h5").exists(), "held-out session 2010 leaked into the practice set"
          assert not (d / "jabs" / "annotations" / "2010.json").exists()
          assert len(anns) == 5, f"expected 5 labelled sessions, found {len(anns)}"
          qc = json.loads((d / "qc_passed_sessions.json").read_text())
          assert qc["passed_sessions"], "qc_passed_sessions.json is empty"
          assert (Path("data/dense_gt_a1/jabs/annotations/2010.json")).exists()
          print("practice set OK:", len(poses), "sessions,", len(anns), "labelled")

          # Features are cached by jabs-init at build time, in the practice set and in the training pool.
          import h5py

          pool = Path("data/zenodo_no_gt_cached/jabs_grooming")
          assert not (pool / "2010_pose_est_v6.h5").exists(), "held-out session 2010 leaked into the training pool"
          for folder, n in ((d, 10), (pool, 24)):
              feats = sorted((folder / "jabs" / "features").glob("*/0/features.h5"))
              assert len(feats) == n, f"{folder}: expected features for {n} sessions, found {len(feats)}"
              with h5py.File(feats[0], "r") as f:
                  assert "window_features_60" in f["features"], f"{folder}: no window-60 features cached"
          print("features cached: practice set 10 sessions, training pool 24 sessions")
          EOF

      - name: The practice set is identical on a second build
        run: |
          source .venv/bin/activate
          (cd data/zenodo_scrubbed && find . -name '*.json' -o -name README.md | sort | xargs shasum > /tmp/before.txt)
          python student_scripts/make_scrubbed_practice_set.py > /dev/null
          (cd data/zenodo_scrubbed && find . -name '*.json' -o -name README.md | sort | xargs shasum > /tmp/after.txt)
          diff /tmp/before.txt /tmp/after.txt

      - name: Execute the live demo notebook headlessly (Linux only)
        if: runner.os == 'Linux'
        run: |
          source .venv/bin/activate
          pip install nbconvert ipykernel
          cd student_notebooks/live_demo
          python -m jupyter nbconvert --to notebook --execute jabs-demo.ipynb \
            --output-dir "$RUNNER_TEMP" --output executed.ipynb --ExecutePreprocessor.timeout=3000
